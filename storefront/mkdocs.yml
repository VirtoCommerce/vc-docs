# Landing page config for /storefront/
# Inherits from root but OVERRIDES plugins to remove redirects
INHERIT: ../mkdocs.yml

theme:
    custom_dir: ../overrides

docs_dir: docs

# Project information
extra_site_name: Documentation
site_name: storefront
site_description: Frontend application documentation center
site_author: Virto Commerce
site_url: https://docs.virtocommerce.org/storefront

# Repository
repo_name: VirtoCommerce/vc-theme-b2b-vue
repo_url: https://github.com/VirtoCommerce/vc-theme-b2b-vue
edit_uri: edit/dev/docs/

# OVERRIDE plugins - NO redirects, NO monorepo!
plugins:
    - search

# Only build index.md
nav:
    - Home: index.md

extra:
    main_page:
        documentation:
            - title: User Guide
              link: user-guide/latest
              image: assets/images/storefront-userquide.png
              description:
                - title: Getting Started
                  link: https://youtu.be/xsnds1QYuC0
                - title: User Documentation
                  link: user-guide/latest/
                - title: Public Demo Environment
                  link: https://virtostart-demo-store.govirto.com/
            - title: Developer Guide
              link: developer-guide/latest
              image: assets/images/storefront-devguide.png
              description:
                - title: Overview
                  link: developer-guide/latest/
                - title: Architecture
                  link: developer-guide/latest/architecture
                - title: Deployment
                  link: developer-guide/latest/deployment
                - title: Integrations
                  link: developer-guide/latest/integrations/prerender_io
            - title: Other Resources
              image: assets/images/storefront-other.png
              description:
                - title: Release Notes
                  link: https://github.com/VirtoCommerce/vc-storefront/releases
                - title: Github
                  link: https://github.com/VirtoCommerce/vc-storefront/
