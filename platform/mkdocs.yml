                    link: user-guide/latest/getting-started
                  - title: User Documentation
                    link: user-guide
                  - title: Versions
                    link: user-guide/latest/versions/virto3-products-versions
                  - title: Deployment of Environments on Virto Cloud
                    link: deployment-on-cloud/latest/deploy-on-virto-cloud
            - title: Developer Guide
              image: assets/images/storefront-devguide.png
