INHERIT: ../../mkdocs.yml

# Hooks to fix search index for versioned docs
hooks:
    - ../../overrides/hooks/search_index_fixer.py
    - ../../overrides/hooks/abbreviations_loader.py
    - ../../overrides/hooks/extra_css_cache_bust.py

# Override plugins for versioned site
# Note: INHERIT doesn't merge plugins, so we must include ALL needed plugins
plugins:
    - search:
        # Configure search for versioned content
        lang: en
        # Only index current version
        index_docs: true
        index_other: false
        # Exclude versioned paths from other versions
        exclude_docs: |
            /1.0/
            /1.1/
            /2.0/
            /latest/
    - awesome-nav
    - git-revision-date-localized
    - minify:
        minify_html: true
        htmlmin_opts:
            remove_comments: true
    - include-markdown
    - mike:
        alias_type: redirect
    - redirects:
        redirect_maps:
            "Fundamentals/PageBuilder/overview.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/overview/"
            "Fundamentals/PageBuilder/create-new-block.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/create-new-block/"
            "Fundamentals/PageBuilder/server-descriptors.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/server-descriptors/"
            "Fundamentals/PageBuilder/settings.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/settings/"
            "Fundamentals/PageBuilder/schemas.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/schemas/"
            "Fundamentals/PageBuilder/component-context.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/component-context/"
            "Fundamentals/PageBuilder/asset.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/asset/"
            "Fundamentals/PageBuilder/getting-started.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/page-builder-setup/"
            "Fundamentals/PageBuilder/calendar.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/calendar/"
            "Fundamentals/PageBuilder/checkbox.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/checkbox/"
            "Fundamentals/PageBuilder/collection.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/collection/"
            "Fundamentals/PageBuilder/color.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/color/"
            "Fundamentals/PageBuilder/files.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/files/"
            "Fundamentals/PageBuilder/header.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/header/"
            "Fundamentals/PageBuilder/images.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/images/"
            "Fundamentals/PageBuilder/markdown.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/markdown/"
            "Fundamentals/PageBuilder/number.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/number/"
            "Fundamentals/PageBuilder/object.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/object/"
            "Fundamentals/PageBuilder/page-builder-extension.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/page-builder-extension/"
            "Fundamentals/PageBuilder/paragraph.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/paragraph/"
            "Fundamentals/PageBuilder/script-based-evaluation.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/script-based-evaluation/"
            "Fundamentals/PageBuilder/search.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/search/"
            "Fundamentals/PageBuilder/select.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/select/"
            "Fundamentals/PageBuilder/string.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/string/"
            "Fundamentals/PageBuilder/text.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/Extensibility/cms-integrations/PageBuilder/text/"
            "GraphQL-Storefront-API-Reference-xAPI/index.md": "https://docs.virtocommerce.org/platform/developer-guide/latest/GraphQL-Storefront-API-Reference-xAPI/overview/"

theme:
    custom_dir: ../../overrides
    hide: false

# Project information
extra_site_name: Platform Dev Docs
site_name: Platform Developer Guide
site_description: Documentation portal for enterprise-level Microsoft .NET ecommerce platform Virto Commerce.
site_author: Virto Commerce
site_url: https://docs.virtocommerce.org/platform/developer-guide
# Base URL for use in search index - mike will append version
use_directory_urls: true

# Repository
repo_name: VirtoCommerce/vc-platform
repo_url: https://github.com/VirtoCommerce/vc-platform
edit_uri: edit/dev/docs/

# Versioning
extra:
    version:
        provider: mike
        default: latest
    # Search configuration for versioned site
    search:
        # Limit search to current version only
        index_only_current: true
        # Exclude other versions from search index
        exclude_versions: true

# CSS and JavaScript (must include ALL files from root, as INHERIT doesn't merge arrays)
extra_css:
    - assets/stylesheets/main.css
    - assets/stylesheets/fonts.css
    - assets/stylesheets/version-selector.css
    - assets/stylesheets/vc-shell-docs.css
    - assets/stylesheets/ai-overrides.css
    - assets/stylesheets/vc-shell-docs.css

extra_javascript:
    - assets/scripts/version-redirect.js
    - assets/scripts/version-selector-handler.js
    - assets/scripts/scroll-menu.js

