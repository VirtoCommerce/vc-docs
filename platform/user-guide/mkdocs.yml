INHERIT: ../../mkdocs.yml

# Hooks to fix search index for versioned docs
hooks:
    - ../../overrides/hooks/search_index_fixer.py
    - ../../overrides/hooks/abbreviations_loader.py
    - ../../overrides/hooks/extra_css_cache_bust.py

# Override plugins for versioned site
plugins:
    - redirects:
        redirect_maps:
            "azure-search/settings.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/azure-search/settings/"
            "backup-and-restore/backup.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/backup-and-restore/backup/"
            "backup-and-restore/overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/backup-and-restore/overview/"
            "backup-and-restore/restore.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/backup-and-restore/restore/"
            "cms-overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/cms-overview/"
            "contentful/overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/contentful/overview/"
            "dynamic-properties/managing-dynamic-properties.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/dynamic-properties/managing-dynamic-properties/"
            "loyalty/configuring-loyalty-points-per-product.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/loyalty/configuring-loyalty-points-per-product/"
            "loyalty/create-loyalty-program.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/loyalty/create-loyalty-program/"
            "loyalty/loyalty-points-history.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/loyalty/loyalty-points-history/"
            "loyalty/set-up-loyalty-catalog-browsing.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/loyalty/set-up-loyalty-catalog-browsing/"
            "opensearch/overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/opensearch/overview/"
            "opensearch/settings.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/opensearch/settings/"
            "page-builder/preview-as-user.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/page-builder/preview-as-user/"
            "page-builder/settings.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/page-builder/settings/"
            "pages/settings.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/pages/settings/"
            "product-snapshot/enabling-products-snapshot.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/product-snapshot/enabling-products-snapshot/"
            "product-snapshot/overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/product-snapshot/overview/"
            "product-snapshot/viewing-products-snapshot.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/product-snapshot/viewing-products-snapshot/"
            "sanity/overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/sanity/overview/"
            "security/settings.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/security/settings/"
            "system-operations/overview.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/system-operations/overview/"
            "white-labeling/settings.md": "https://docs.virtocommerce.org/platform/user-guide/stable15/white-labeling/settings/"
    - search:
        # Configure search for versioned content
        lang: en
        # Only index current version
        index_docs: true
        index_other: false
        # Exclude versioned paths from other versions
        exclude_docs: |
            /1.0/
            /1.1/
            /2.0/
            /latest/
    - awesome-nav
    - git-revision-date-localized
    - minify
    - include-markdown
    - mike:
        alias_type: redirect
theme:
    custom_dir: ../../overrides
    hide: false

# Project information
extra_site_name: Platform User Docs
site_name: Platform User Guide
site_description: Documentation portal for Virto Commerce, an enterprise-level Microsoft .NET ecommerce platform.
site_author: Virto Commerce
site_url: https://docs.virtocommerce.org/platform/user-guide
use_directory_urls: true

# Repository
repo_name: VirtoCommerce/vc-platform
repo_url: https://github.com/VirtoCommerce/vc-platform
edit_uri: edit/dev/docs/

# Versioning
extra:
    version:
        provider: mike
        default: latest
    # Search configuration for versioned site
    search:
        # Limit search to current version only
        index_only_current: true
        # Exclude other versions from search index
        exclude_versions: true

# CSS and JavaScript (must include ALL files from root, as INHERIT doesn't merge arrays)
extra_css:
    - assets/stylesheets/main.css
    - assets/stylesheets/fonts.css
    - assets/stylesheets/version-selector.css
    - assets/stylesheets/ai-overrides.css

extra_javascript:
    - assets/scripts/version-redirect.js
    - assets/scripts/version-selector-handler.js
    - assets/scripts/scripts-loader.js
    - assets/scripts/scroll-menu.js

