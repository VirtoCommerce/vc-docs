# Landing page config for /marketplace/
# Inherits from root but OVERRIDES plugins to remove redirects
INHERIT: ../mkdocs.yml

theme:
    custom_dir: ../overrides

docs_dir: docs

# Project information
extra_site_name: Documentation
site_name: marketplace
site_description: Marketplace documentation center
site_author: Virto Commerce
site_url: https://docs.virtocommerce.org/marketplace

# Repository
repo_name: VirtoCommerce/vc-deploy-marketplace
repo_url: https://github.com/VirtoCommerce/vc-deploy-marketplace
edit_uri: edit/dev/docs/

# OVERRIDE plugins - NO redirects, NO monorepo!
plugins:
    - search

# Only build index.md
nav:
    - Home: index.md

extra:
    main_page:
        documentation:
            - title: User Guide
              image: assets/images/storefront-userquide.png
              link: user-guide/latest
              description:
                  - title: Operator Portal
                    link: user-guide/latest/Operator-portal/overview
                  - title: Vendor Portal
                    link: user-guide/latest/Vendor-portal/overview
            - title: Developer Guide [In Progress]
              link: developer-guide/latest
              image: assets/images/storefront-devguide.png
              description:
                  - title: State Machine Module
                    link: developer-guide/latest/state-machine-module/overview
            - title: Other Resources
              image: assets/images/storefront-other.png
              description:
                  - title: Release Notes
                    link: https://github.com/VirtoCommerce/vc-deploy-marketplace/releases
                  - title: Github
                    link: https://github.com/VirtoCommerce/vc-deploy-marketplace
