name: Snapshot previous version on bump

on:
  push:
    branches:
      - main

concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot-previous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Detect bump and create release branch
        id: snapshot
        run: |
          set -euo pipefail

          # 1. Must be a merge commit (>= 2 parents, so >= 3 tokens in rev-list output).
          read -ra parents_arr <<< "$(git rev-list --parents -n 1 HEAD)"
          if [ "${#parents_arr[@]}" -lt 3 ]; then
            echo "HEAD is not a merge commit — nothing to do."
            exit 0
          fi

          # 2. Diff between HEAD and HEAD^1 must contain only the VERSION file.
          changed=$(git diff --name-only --diff-filter=M HEAD^1 HEAD)
          if [ "$changed" != "VERSION" ]; then
            echo "PR merged, but diff is not bump-only (modified files: $changed). Not a bump."
            exit 0
          fi

          # 3. Read the previous version from HEAD^1's VERSION.
          prev=$(git show HEAD^1:VERSION | tr -d '[:space:]')
          if [ -z "$prev" ]; then
            echo "❌ Could not read previous VERSION from HEAD^1 — aborting."
            exit 1
          fi

          # VERSION is arbitrary repo content, so constrain it before it reaches
          # a branch name or a shell word. Letters, digits, dot, dash, underscore.
          if ! printf '%s' "$prev" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "❌ Previous VERSION '$prev' contains unsupported characters — aborting."
            exit 1
          fi
          echo "Previous version: $prev"

          branch="release/$prev"
          echo "release-branch=$branch" >> "$GITHUB_OUTPUT"

          # 4. Skip creation if the release branch already exists on origin. The
          #    Context7 registration step still runs; it is idempotent.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists on origin — skipping creation."
            exit 0
          fi

          # 5. Create and push the branch from HEAD^1.
          git branch "$branch" HEAD^1
          git push origin "$branch"
          echo "✅ Created $branch from $(git rev-parse HEAD^1)"

      # Context7 indexes the default branch only, so every superseded version has
      # to be declared explicitly or it disappears from the index. Without this,
      # the branch list is the only place older versions are visible, which is
      # exactly the confusion this automation removes.
      - name: Register release branch with Context7
        if: steps.snapshot.outputs.release-branch != ''
        env:
          REL_BRANCH: ${{ steps.snapshot.outputs.release-branch }}
        run: |
          set -euo pipefail

          # 1. Insert the branch at the head of previousVersions, newest first.
          #    Idempotent: an existing entry leaves the file untouched.
          python3 - <<'PY'
          import json
          import os
          import sys

          PATH = "context7.json"
          MAX_ITEMS = 20  # Schema cap: context7.com/schema/context7.json
          branch = os.environ["REL_BRANCH"]

          with open(PATH) as fh:
              cfg = json.load(fh)

          versions = cfg.setdefault("previousVersions", [])
          if any(isinstance(e, dict) and e.get("branch") == branch for e in versions):
              print(f"{branch} already registered — nothing to do.")
              sys.exit(0)

          versions.insert(0, {"branch": branch})
          if len(versions) > MAX_ITEMS:
              dropped = versions[MAX_ITEMS:]
              del versions[MAX_ITEMS:]
              print(f"::warning::previousVersions hit the {MAX_ITEMS} entry cap. "
                    f"Dropped the oldest: {dropped}")

          with open(PATH, "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")
          print(f"Registered {branch}.")
          PY

          if git diff --quiet -- context7.json; then
            echo "context7.json unchanged — nothing to push."
            exit 0
          fi

          # 2. Push to main. deploy.yml ignores context7.json-only pushes, so this
          #    commit does not trigger a redeploy.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add context7.json
          git commit -m "Register $REL_BRANCH with Context7"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ Registered $REL_BRANCH in context7.json"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Could not push the context7.json update after 3 attempts. Add {\"branch\": \"$REL_BRANCH\"} to previousVersions manually."
          exit 1
