name: Deploy versioned docs

on:
  push:
    branches:
      - main
      - 'release/**'
    # context7.json only configures the external Context7 indexer and has no
    # effect on the built site. bump.yml commits it to main automatically, so
    # ignoring it here keeps that commit from triggering a pointless redeploy.
    # A push that touches it alongside real content still deploys.
    paths-ignore:
      - 'context7.json'
  # Manual trigger: rebuild and redeploy the prod image from the selected branch.
  # Run on `main` to refresh the non-versioned landing pages (/, /platform/, ...),
  # which are baked into the prod image only from `main`.
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Build and push
        id: build
        uses: VirtoCommerce/vc-github-actions/update-virtocommerce-docs-versioned@master
        with:
          githubToken: ${{ secrets.REPO_TOKEN }}
          ref: ${{ github.ref_name }}
          setAsLatest: ${{ github.ref_name == 'main' }}
          setAsDefault: ${{ github.ref_name == 'main' }}
          dockerRegistry: ${{ secrets.MAIN_DOCKER_REGISTRY }}
          dockerUsr: ${{ secrets.VCPT_DOCKER_USER }}
          dockerPwd: ${{ secrets.VCPT_DOCKER_PASSWORD }}

      # Only `main` updates the live prod image. The image build above bakes in
      # the non-versioned landing pages (/, /platform/, /storefront/, /marketplace/)
      # from whatever branch triggered the run. release/** branches carry stale
      # landing sources (and lack newer header changes), so deploying their image
      # would clobber the landings built from main. release/** still runs the build
      # above, which pushes its versioned guide to gh-pages via mike; it just does
      # not get promoted to prod. A subsequent main run (or manual workflow_dispatch)
      # bakes the refreshed gh-pages versions into the prod image.
      - name: Trigger cloud deploy
        id: dispatch
        if: github.ref_name == 'main'
        run: |
          echo "dispatched-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api repos/VirtoCommerce/vc-github-actions/dispatches \
            -f event_type=deploy-docs \
            -f "client_payload[image_tag]=${{ steps.build.outputs.docker-image-tag }}" \
            -f "client_payload[environment]=vcpt-license"
          echo "✅ Dispatched cloud deploy for ${{ steps.build.outputs.docker-image-tag }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}

      - name: Wait for cloud deploy
        if: github.ref_name == 'main'
        timeout-minutes: 30
        run: |
          set -euo pipefail

          # 1. Find the downstream run spawned by the dispatch above.
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list -R VirtoCommerce/vc-github-actions \
              --workflow "Deploy docs to VC Cloud" \
              --event repository_dispatch \
              --created ">=$DISPATCHED_AT" \
              --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::Cloud deploy run never appeared in VirtoCommerce/vc-github-actions within 5 minutes. The deploy-docs dispatch may have been lost."
            exit 1
          fi

          run_url="https://github.com/VirtoCommerce/vc-github-actions/actions/runs/$run_id"
          echo "Watching cloud deploy: $run_url"

          # 2. Fail this workflow if the downstream deploy fails.
          if ! gh run watch "$run_id" -R VirtoCommerce/vc-github-actions --interval 30 --exit-status; then
            echo "::error::Cloud deploy FAILED. The docs image was built and pushed, but prod was NOT updated. Inspect: $run_url"
            exit 1
          fi
          echo "✅ Cloud deploy succeeded: $run_url"
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched-at }}
